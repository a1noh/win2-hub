<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- 멤버 이름/내부 정보가 있으므로 검색엔진에 노출 금지 (비밀은 아니고 링크 전용) -->
  <meta name="robots" content="noindex, nofollow">
  <title>WIN2 공지 허브</title>

  <!-- Pretendard (한글 친화 폰트) — 유일한 외부 호출 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- ?v= 숫자는 "캐시 버전". 업데이트가 바로 반영되게 push 할 때마다 1씩 올립니다. -->
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main id="app" class="wrap">
    <!-- 모든 내용은 app.js 가 data.js 를 읽어 채웁니다. -->
    <noscript>
      <p style="padding:1rem">이 페이지를 보려면 자바스크립트가 필요합니다.</p>
    </noscript>
  </main>

  <script src="data.js?v=3"></script>
  <script>
    // 민감 정보(기도 제목 등)는 로컬에서만 불러옵니다.
    // data.local.js 는 git/공개 사이트에 올라가지 않으므로, 공개 사이트에서는 로드하지 않습니다.
    (function () {
      var h = location.hostname;
      var local = location.protocol === "file:" || h === "localhost" || h === "127.0.0.1" || h === "";
      if (local) document.write('<scr' + 'ipt src="data.local.js"><\/scr' + 'ipt>');
    })();
  </script>
  <script src="app.js?v=3"></script>
</body>
</html>
